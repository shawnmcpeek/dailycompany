name: benedictdaily
description: "Benedict Daily — The Rule, read as monks read it."
publish_to: 'none'
version: 0.1.2+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2
  vibration: ^3.1.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  purchases_flutter: ^10.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/branding/
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#801418"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#801418"
    theme_color: "#801418"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter_native_splash:
  color: "#640F0C"
  image: assets/branding/app_logo.png
  color_dark: "#640F0C"
  image_dark: assets/branding/app_logo.png
  android_12:
    color: "#640F0C"
    icon_background_color: "#640F0C"
    image: assets/branding/app_icon.png
    color_dark: "#640F0C"
    icon_background_color_dark: "#640F0C"
    image_dark: assets/branding/app_icon.png
  ios: true
  web: true
  android: true
